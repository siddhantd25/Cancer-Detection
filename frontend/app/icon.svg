<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect width="32" height="32" rx="7" fill="url(#g)"/>

  <!-- Nucleus dot -->
  <circle cx="16" cy="16" r="3" fill="white"/>

  <!-- Orbital arcs (two pairs at opposing opacities) -->
  <path d="M16 6a10 10 0 0 1 10 10" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <path d="M16 26a10 10 0 0 1-10-10" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  <path d="M6 16a10 10 0 0 1 10-10" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
  <path d="M26 16a10 10 0 0 1-10 10" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>

  <!-- Crosshair tick marks -->
  <line x1="16" y1="6"  x2="16" y2="9"  stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="23" x2="16" y2="26" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="6"  y1="16" x2="9"  y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <line x1="23" y1="16" x2="26" y2="16" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
